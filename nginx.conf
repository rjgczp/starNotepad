server {
    listen 80;
    server_name charles.ski www.charles.ski;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin-web:80/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/profile-img/ {
        proxy_pass http://home-web:3000/api/profile-img/;
    }

    location /api/ {
        proxy_pass http://gva-server:8888/api/;
    }

    location /uploads/ {
        proxy_pass http://gva-server:8888/uploads/;
    }

    location /swagger/ {
        proxy_pass http://gva-server:8888/swagger/;
    }

    location /docs {
        proxy_pass http://gva-server:8888/docs;
    }

    location /map/ {
        proxy_pass http://bluemap:8100/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://home-web:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
