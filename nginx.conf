map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Compress text assets at the shared edge gateway. Upstreams that already
# return compressed responses are passed through unchanged.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/wasm
    application/xml
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    server_name xiaoyu.ski home.xiaoyu.ski blog.xiaoyu.ski ai.xiaoyu.ski ht.xiaoyu.ski map.xiaoyu.ski;
    return 301 https://$host$request_uri;
}

# Shared TLS settings are repeated per virtual host so this file can be mounted
# directly as /etc/nginx/conf.d/default.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name xiaoyu.ski home.xiaoyu.ski;
    client_max_body_size 512m;

    ssl_certificate /etc/nginx/ssl/xiaoyu.ski.pem;
    ssl_certificate_key /etc/nginx/ssl/xiaoyu.ski.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/bc/chat {
        proxy_pass http://home-web:3000/api/bc/chat;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location /api/profile-img/ {
        proxy_pass http://home-web:3000/api/profile-img/;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location /api/ {
        proxy_pass http://gva-server:8888/api/;
    }

    location /uploads/ {
        proxy_pass http://gva-server:8888/uploads/;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location = /map {
        return 301 https://map.xiaoyu.ski/;
    }

    location /map/ {
        rewrite ^/map/(.*)$ https://map.xiaoyu.ski/$1 permanent;
    }

    location /swagger/ {
        proxy_pass http://gva-server:8888/swagger/;
    }

    location /_next/static/ {
        proxy_pass http://home-web:3000;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://home-web:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

