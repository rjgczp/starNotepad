services:
  mysql:
    image: mysql:8.0.45
    container_name: gva-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-starNotepad}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  gva-server:
    image: golang:1.24-alpine
    container_name: gva-server-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "go env -w GOPROXY=https://goproxy.cn,direct GOSUMDB=sum.golang.google.cn && go run -mod=mod . -c config.docker.yaml"
    environment:
      CGO_ENABLED: "0"
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      DB_PATH: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      GVA_JWT_SIGNING_KEY: ${GVA_JWT_SIGNING_KEY:?GVA_JWT_SIGNING_KEY is required}
      GVA_EMAIL_SECRET: ${GVA_EMAIL_SECRET:-}
    ports:
      - "${GVA_SERVER_PORT:-8888}:8888"
    volumes:
      - ./gin-vue-admin/server:/app
      - ./uploads:/app/uploads
      - ./logs:/app/log
      - /Users/sansea/go/pkg/mod:/go/pkg/mod
      - /Users/sansea/Library/Caches/go-build:/root/.cache/go-build
    depends_on:
      mysql:
        condition: service_healthy

  home-web:
    image: node:20-alpine
    container_name: home-web-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      BLOG_PROFILE_API_URL: http://gva-server:8888/api/bc/getUserBlog_configPublic
      MAIN_IMAGE_API_URL: http://gva-server:8888/api/mainImage/public
      BACKEND_URL: http://gva-server:8888
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${HOME_WEB_PORT:-3000}:3000"
    depends_on:
      - gva-server
    volumes:
      - ./personal-home-next:/app
      - /app/node_modules

  admin-web:
    image: node:20-alpine
    container_name: admin-web-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "rm -f .env.development.local && npm config set registry https://registry.npmmirror.com && ([ -d node_modules/vite ] || npm ci) && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ADMIN_WEB_DEV_PORT:-5173}:5173"
    depends_on:
      - gva-server
    volumes:
      - ./gin-vue-admin/web:/app
      - /app/node_modules

  # ---- blog-frontend Next.js 博客前端 ----
  blog-frontend:
    image: node:22-alpine
    container_name: blog-frontend-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm ci && npm run dev -- --port 3001 --hostname 0.0.0.0 --webpack"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_URL: http://gva-server:8888
    ports:
      - "${BLOG_FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./blog-frontend:/app
      - /app/node_modules

  duo-call-web:
    image: node:22-alpine
    container_name: duo-call-web-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3002"
    environment:
      VITE_DUO_API_URL: /api
      DUO_API_PROXY: http://gva-server:8888
    ports:
      - "${DUO_CALL_WEB_PORT:-3002}:3002"
    volumes:
      - ./duo-call-web:/app
      - /app/node_modules

  coturn:
    image: coturn/coturn:4.6.2
    container_name: duo-call-turn-dev
    profiles: ["turn"]
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf.example:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  bluemap:
    image: eclipse-temurin:25-jre
    container_name: bluemap-dev
    restart: unless-stopped
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,gva-server}
    working_dir: /app
    command: ["java", "-jar", "/opt/bluemap-cli.jar", "-r", "-u", "-w"]
    ports:
      - "${BLUEMAP_PORT:-8100}:8100"
    volumes:
      - ./bluemap/cli.jar:/opt/bluemap-cli.jar:ro
      - ./bluemap/config:/app/config
      - ./bluemap/data:/app/data
      - ./bluemap/web:/app/webroot
      - ./bluemap/active-world:/app/world

volumes:
  gva-go-mod-cache:
  gva-go-build-cache:
