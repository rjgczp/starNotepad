name: Duo Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "duo-call-web/**"
      - ".github/workflows/duo-windows-desktop.yml"
  push:
    branches:
      - "codex/windows-desktop-release"
    paths:
      - "duo-call-web/**"
      - ".github/workflows/duo-windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: duo-call-web
    env:
      VITE_DUO_NATIVE: "true"
      VITE_DUO_API_URL: "https://ai.xiaoyu.ski/api"
      VITE_DUO_ICE_SERVERS: '[{"urls":"stun:turn.xiaoyu.ski:3478"}]'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duo-call-web/package-lock.json

      - name: Configure Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            duo-call-web/src-tauri/target
          key: windows-cargo-${{ hashFiles('duo-call-web/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build Windows executable installer
        run: npm run desktop:build -- --bundles nsis

      - name: Build Windows MSI installer
        run: npm run desktop:build -- --bundles msi

      - name: Upload Windows installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: duo-cottage-windows-${{ github.sha }}
          path: |
            duo-call-web/src-tauri/target/release/bundle/msi/*.msi
            duo-call-web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
