<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 地图查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .loading {
            color: white;
            text-align: center;
            font-size: 1.1rem;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            max-width: 500px;
            text-align: center;
        }
        
        .error h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        
        .error button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        
        .error button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .map-container {
            width: 100%;
            height: calc(100vh - 120px);
            background: white;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .info {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }
        
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Minecraft 地图查看器</h1>
        <p>基于 BlueMap 的实时 3D 世界地图</p>
    </div>
    
    <div class="container" id="container">
        <div class="loading">
            <div class="spinner"></div>
            正在加载地图配置...
        </div>
    </div>
    
    <div class="info" id="info" style="display: none;">
        <span id="worldInfo"></span>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:8889' 
            : `http://${window.location.hostname}:8889`;
        
        async function loadActiveWorld() {
            const container = document.getElementById('container');
            const info = document.getElementById('info');
            const worldInfo = document.getElementById('worldInfo');
            
            try {
                const response = await fetch(`${API_BASE}/api/ufile/minecraft/active`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.code !== 200) {
                    throw new Error(result.message || '获取活跃世界配置失败');
                }
                
                const activeWorld = result.data;
                
                if (!activeWorld.isActive || !activeWorld.MapURL) {
                    throw new Error('当前没有活跃的 Minecraft 世界');
                }
                
                // Create map iframe
                container.innerHTML = `
                    <div class="map-container">
                        <iframe src="${activeWorld.MapURL}" allowfullscreen></iframe>
                    </div>
                `;
                
                // Show world info
                worldInfo.textContent = `当前世界: ${activeWorld.WorldPath}`;
                info.style.display = 'block';
                
            } catch (error) {
                console.error('Failed to load active world:', error);
                console.log('Using fallback configuration...');
                
                // Fallback to default BlueMap configuration
                const defaultWorldPath = '/Users/charles/Documents/notepad/gin-vue-admin/server/uploads/file/5dc8ac4829e99f6b5d333881a92c7f24_20260429141901/新的世界';
                const defaultMapURL = 'http://localhost:8100';
                
                container.innerHTML = `
                    <div class="map-container">
                        <iframe src="${defaultMapURL}" allowfullscreen></iframe>
                    </div>
                `;
                
                worldInfo.textContent = `当前世界: ${defaultWorldPath} (默认配置)`;
                info.style.display = 'block';
            }
        }
        
        // Load active world when page loads
        document.addEventListener('DOMContentLoaded', loadActiveWorld);
        
        // Refresh every 30 seconds to check for updates
        setInterval(loadActiveWorld, 30000);
    </script>
</body>
</html>
