<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的博客</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #0ea5e9;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 45%);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 18px 56px;
      }

      .hero {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 26px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      }

      .tag {
        display: inline-block;
        font-size: 12px;
        color: #0c4a6e;
        background: #e0f2fe;
        padding: 4px 10px;
        border-radius: 999px;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: 34px;
        line-height: 1.2;
      }

      .desc {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 22px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .footer {
        margin-top: 28px;
        font-size: 13px;
        color: var(--muted);
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <span class="tag">My Blog</span>
        <h1>欢迎来到我的博客</h1>
        <p class="desc">
          这里记录开发笔记、产品想法和日常灵感。当前页面是一个简洁版首页，可直接作为 3000 端口前端入口。
        </p>
      </section>

      <section class="grid">
        <article class="card">
          <h3>最近文章：Nginx 路由实践</h3>
          <p>如何让服务器 IP 默认进博客，`/admin` 进入后台，兼顾静态资源与 WebSocket 转发。</p>
        </article>
        <article class="card">
          <h3>最近文章：Go 接口安全</h3>
          <p>从字段加密、鉴权边界到日志脱敏，梳理后端常见的安全落地细节。</p>
        </article>
        <article class="card">
          <h3>关于我</h3>
          <p>热爱构建小而美的工具。欢迎通过 <a href="mailto:hello@example.com">hello@example.com</a> 联系我。</p>
        </article>
      </section>

      <footer class="footer">© 2026 我的博客 · Powered by Nginx + Frontend</footer>
    </main>
  </body>
</html>
