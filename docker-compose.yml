services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.45}
    container_name: gva-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-starNotepad}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./mysql_data:/var/lib/mysql
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  gva-server:
    image: ${GVA_SERVER_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:gva-server-latest}
    container_name: gva-server
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    entrypoint: ["/go/src/github.com/flipped-aurora/gin-vue-admin/server/server"]
    command: ["-c", "/app/config.yaml"]
    expose:
      - "8888"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GVA_CONFIG: /app/config.yaml
      GIN_MODE: release
      DB_PATH: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      GVA_JWT_SIGNING_KEY: ${GVA_JWT_SIGNING_KEY:?GVA_JWT_SIGNING_KEY is required}
      GVA_EMAIL_SECRET: ${GVA_EMAIL_SECRET:-}
      DUO_CALL_JWT_SECRET: ${DUO_CALL_JWT_SECRET:?DUO_CALL_JWT_SECRET is required}
      DUO_CALL_KEY_ENCRYPTION_KEY: ${DUO_CALL_KEY_ENCRYPTION_KEY:?DUO_CALL_KEY_ENCRYPTION_KEY is required}
      DUO_TURN_HOST: ${DUO_TURN_HOST:-turn.xiaoyu.ski}
      DUO_TURN_USERNAME: ${DUO_TURN_USERNAME:?DUO_TURN_USERNAME is required}
      DUO_TURN_PASSWORD: ${DUO_TURN_PASSWORD:?DUO_TURN_PASSWORD is required}
    volumes:
      - ./gin-vue-admin/server/config.yaml:/app/config.yaml
      - ./uploads:/go/src/github.com/flipped-aurora/gin-vue-admin/server/uploads
      - ./logs:/go/src/github.com/flipped-aurora/gin-vue-admin/server/log

  home-web:
    image: ${HOME_WEB_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:home-web-latest}
    container_name: home-web
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      BLOG_PROFILE_API_URL: http://gva-server:8888/api/bc/getUserBlog_configPublic
      MAIN_IMAGE_API_URL: http://gva-server:8888/api/mainImage/public
      BACKEND_URL: http://gva-server:8888
      NODE_ENV: production
    depends_on:
      - gva-server

  blog-frontend:
    image: ${BLOG_FRONTEND_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:blog-frontend-latest}
    container_name: blog-frontend
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      NODE_ENV: production
      BACKEND_URL: http://gva-server:8888
    expose:
      - "3000"
    depends_on:
      - gva-server

  duo-call-web:
    image: ${DUO_CALL_WEB_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:duo-call-web-latest}
    container_name: duo-call-web
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    expose:
      - "80"
    depends_on:
      - gva-server

  admin-web:
    image: ${ADMIN_WEB_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:admin-web-latest}
    container_name: admin-web
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      - gva-server

  gva-web:
    image: nginx:alpine
    container_name: gva-web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /home/ubuntu/opt/data/ssl/xiaoyu.ski.pem:/etc/nginx/ssl/xiaoyu.ski.pem:ro
      - /home/ubuntu/opt/data/ssl/xiaoyu.ski.key:/etc/nginx/ssl/xiaoyu.ski.key:ro
    depends_on:
      - gva-server
      - home-web
      - admin-web
      - blog-frontend
      - duo-call-web
      - bluemap

  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    restart: always
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf.example:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${DUO_TURN_HOST:-turn.xiaoyu.ski}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --user=${DUO_TURN_USERNAME:?DUO_TURN_USERNAME is required}:${DUO_TURN_PASSWORD:?DUO_TURN_PASSWORD is required}

  bluemap:
    image: ${BLUEMAP_IMAGE:-eclipse-temurin:25-jre}
    container_name: bluemap
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,gva-server}
    working_dir: /app
    command: ["java", "-jar", "/opt/bluemap-cli.jar", "-r", "-u", "-w"]
    expose:
      - "8100"
    volumes:
      - ./bluemap/cli.jar:/opt/bluemap-cli.jar:ro
      - ./bluemap/config:/app/config
      - ./bluemap/data:/app/data
      - ./bluemap/web:/app/webroot
      - ./bluemap/active-world:/app/world

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --interval 300 --cleanup --label-enable
