services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.45}
    container_name: gva-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123123}     # 要和 server/config.yaml 里的 mysql.password 一致
      MYSQL_DATABASE: ${MYSQL_DATABASE:-starNotepad}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  gva-server:
    image: ${GVA_SERVER_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:gva-server-latest}
    container_name: gva-server
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    entrypoint: ["/go/src/github.com/flipped-aurora/gin-vue-admin/server/server"]
    command: ["-c", "/app/config.yaml"]
    ports:
      - "${GVA_SERVER_PORT:-8888}:8888"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GVA_CONFIG: /app/config.yaml
      DB_PATH: mysql                  # 关键：容器内应连服务名，不是 127.0.0.1
    volumes:
      - ./gin-vue-admin/server/config.yaml:/app/config.yaml
      - ./uploads:/app/uploads
      - ./logs:/app/log

  home-web:
    image: ${HOME_WEB_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:home-web-latest}
    container_name: home-web
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      BLOG_PROFILE_API_URL: http://gva-server:8888/api/bc/getUserBlog_configPublic
      NODE_ENV: production
    depends_on:
      - gva-server

  admin-web:
    image: ${ADMIN_WEB_IMAGE:-crpi-nxt6ib76b78qk7wc.cn-beijing.personal.cr.aliyuncs.com/charles1337/charles:admin-web-latest}
    container_name: admin-web
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      - gva-server

  gva-web:
    image: nginx:alpine
    container_name: gva-web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
      - "${ADMIN_PORT:-8899}:8899"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gva-server
      - home-web
      - admin-web

  bluemap:
    image: ${BLUEMAP_IMAGE:-eclipse-temurin:25-jre}
    container_name: bluemap
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,gva-server}
    working_dir: /app
    command: ["java", "-jar", "/opt/bluemap-cli.jar", "-r", "-u", "-w"]
    ports:
      - "${BLUEMAP_PORT:-8100}:8100"
    volumes:
      - ./bluemap/cli.jar:/opt/bluemap-cli.jar:ro
      - ./bluemap/config:/app/config
      - ./bluemap/data:/app/data
      - ./bluemap/web:/app/webroot
      - ./bluemap/active-world:/app/world

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --interval 300 --cleanup --label-enable
