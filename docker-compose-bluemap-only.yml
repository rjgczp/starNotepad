version: "3.8"

services:
  # 仅运行 BlueMap 相关服务
  bluemap:
    image: eclipse-temurin:25-jre
    container_name: bluemap
    restart: always
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    working_dir: /app
    command: ["java", "-jar", "/opt/bluemap-cli.jar", "-r", "-u", "-w"]
    ports:
      - "8100:8100"
    volumes:
      - ./bluemap/cli.jar:/opt/bluemap-cli.jar:ro
      - ./bluemap/config:/app/config
      - ./bluemap/data:/app/data
      - ./bluemap/web:/app/webroot
      - ./gin-vue-admin/server/uploads/file:/app/world

  # 独立前端
  bluemap-frontend:
    image: nginx:alpine
    container_name: bluemap-frontend
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./bluemap-frontend/index.html:/usr/share/nginx/html/index.html:ro
